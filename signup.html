<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Create your Qenrec workspace." />

    <title>Create your Qenrec workspace</title>

    <!-- =====================================================
       FONT
       ===================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
       BOOTSTRAP
       ===================================================== -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- =====================================================
       PHOSPHOR ICONS
       ===================================================== -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />

    <!-- =====================================================
       QENREC SIGNUP CSS
       ===================================================== -->
    <link rel="stylesheet" href="css/signup.css" />

    <!-- =====================================================
       FAVICON
       ===================================================== -->
    <link rel="icon" type="image/png" href="media/favicon/Qenrec fav.png" />
  </head>

  <body class="qenrec-signup-page">
    <main class="signup-stage">
      <section class="signup-panel">
        <!-- =====================================================
           TOP BRAND
           ===================================================== -->
        <div class="signup-panel__brand">
          <a href="#" class="signup-logo" aria-label="Qenrec home">
            <img src="assets/qenrec-logo.png" alt="Qenrec" />
          </a>
        </div>

        <!-- =====================================================
           MAIN TWO-COLUMN AREA
           ===================================================== -->
        <div class="container-fluid px-0 signup-main">
          <div class="row g-0 align-items-stretch signup-row">
            <!-- =================================================
               LEFT: FORM
               ================================================= -->
            <div class="col-lg-6">
              <div class="signup-form-column">
                <div class="signup-heading">
                  <span class="signup-kicker"> Create workspace </span>

                  <h1>Set up your Qenrec workspace</h1>

                  <p>
                    Start with your organization. You can invite your team
                    later.
                  </p>
                </div>

                <form class="signup-form" action="dashboard.html" method="get">
                  <!-- Name -->
                  <div class="signup-field">
                    <label for="fullName"> Full name </label>

                    <div class="signup-input">
                      <i class="ph ph-user"></i>

                      <input
                        id="fullName"
                        name="full_name"
                        type="text"
                        placeholder="Teddrick"
                        autocomplete="name"
                        required
                      />
                    </div>
                  </div>

                  <!-- Workspace -->
                  <div class="signup-field">
                    <label for="workspaceName"> Workspace name </label>

                    <div class="signup-input">
                      <i class="ph ph-buildings"></i>

                      <input
                        id="workspaceName"
                        name="workspace_name"
                        type="text"
                        placeholder="Acme Studio"
                        required
                      />
                    </div>
                  </div>

                  <!-- Email -->
                  <div class="signup-field">
                    <label for="email"> Work email </label>

                    <div class="signup-input">
                      <i class="ph ph-envelope-simple"></i>

                      <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="yourcompany@gmail.com"
                        autocomplete="email"
                        required
                      />
                    </div>
                  </div>

                  <!-- Password -->
                  <div class="signup-field mb-2">
                    <label for="password"> Password </label>

                    <div class="signup-input">
                      <i class="ph ph-lock-key"></i>

                      <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                      />

                      <button
                        class="signup-password-toggle"
                        type="button"
                        aria-label="Show password"
                      >
                        <i class="ph ph-eye"></i>
                      </button>
                    </div>
                  </div>

                  <!-- Terms -->
                  <label class="signup-terms">
                    <input type="checkbox" required />

                    <span>
                      I agree to the
                      <a href="#terms"> Terms of Service </a>
                      and
                      <a href="#privacy"> Privacy Policy </a>.
                    </span>
                  </label>

                  <!-- Submit -->
                  <button class="signup-submit" type="submit">
                    Create workspace

                    <i class="ph ph-arrow-right" aria-hidden="true"></i>
                  </button>

                  <!-- Existing account -->
                  <p class="signup-existing">
                    Already have a workspace?

                    <a href="login.html"> Log in </a>
                  </p>
                </form>

                <!-- =================================================
                   SOCIAL LOGIN
                   ================================================= -->
                <div class="signup-divider">
                  <span> or continue with </span>
                </div>

                <div class="signup-socials">
                  <button type="button" aria-label="Continue with Google">
                    <i class="ph ph-google-logo"></i>
                  </button>

                  <button type="button" aria-label="Continue with Apple">
                    <i class="ph ph-apple-logo"></i>
                  </button>

                  <button type="button" aria-label="Continue with Microsoft">
                    <i class="ph ph-microsoft-logo"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- =================================================
               RIGHT: VISUAL
               ================================================= -->
            <div class="col-lg-6">
              <div class="signup-visual">
                <div class="signup-visual__image-wrap">
                  <img
                    class="signup-visual__image"
                    src="assets/quenrec_rep.png"
                    alt="Qenrec workspace visual"
                  />

                  <div class="signup-visual__bottom-fade"></div>
                </div>

                <div class="signup-visual__caption">
                  <span class="signup-visual__caption-kicker">
                    Your workspace
                  </span>

                  <p>
                    One clear place for the work that happens before the work
                    begins.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- =====================================================
           BOTTOM LEGAL
           ===================================================== -->
        <div class="signup-panel__bottom">
          <span> © 2026 Qenrec </span>

          <span class="signup-panel__bottom-divider"></span>

          <a href="#terms"> Terms &amp; Conditions </a>

          <a href="#privacy"> Privacy Policy </a>
        </div>
      </section>
    </main>

    <script src="signup-reference.js"></script>
  </body>
</html>
